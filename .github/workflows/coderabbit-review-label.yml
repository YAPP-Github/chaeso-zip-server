name: CodeRabbit review scope

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]
    branches: [main, dev]

permissions:
  issues: write
  pull-requests: read

jobs:
  manage-review-label:
    name: Limit automatic reviews to dev PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: coderabbit-review-scope-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Add or remove CodeRabbit opt-in label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const label = "coderabbit-auto-review";

            // 이벤트가 대기하는 동안 PR 대상 브랜치가 바뀔 수 있으므로 최신 상태를 사용한다.
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issue_number,
            });
            const shouldHaveLabel = pullRequest.base.ref === "dev";
            const hasLabel = pullRequest.labels.some(({ name }) => name === label);

            if (shouldHaveLabel !== hasLabel) {
              if (shouldHaveLabel) {
                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label,
                    color: "7057ff",
                    description: "Enables automatic CodeRabbit review for dev PRs",
                  });
                } catch (error) {
                  if (error.status !== 422) throw error;

                  // 동시 실행이 먼저 라벨을 생성한 경우인지 확인한다.
                  await github.rest.issues.getLabel({ owner, repo, name: label });
                }

                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [label],
                });
              } else {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number,
                    name: label,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
