name: Label dev PRs for CodeRabbit review

on:
  pull_request:
    types: [opened, reopened]
    branches: [dev]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr edit "${{ github.event.pull_request.number }}" --add-label coderabbit-auto-review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
