springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_0
  swagger-ui:
    enabled: true
  default-produces-media-type: application/json

spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:chaeso-zip;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  mail:
    host: localhost
    port: 1025
  data:
    redis:
      host: localhost
      port: 16379

management:
  health:
    redis:
      enabled: false
    mail:
      enabled: false

jwt:
  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVm
  access-ttl: PT30M
  refresh-ttl: P14D
  refresh-absolute-ttl: P90D

app:
  google:
    client-id: test-google-client-id
    signup-ttl: PT10M
  cors:
    allowed-origins: http://localhost:3000
  consent:
    terms-version: v1.0
  email-verification:
    from: no-reply@chaeso-zip.com
    code-ttl: PT5M
    verified-ttl: PT30M
    max-verify-attempts: 5
    send-cooldown: PT1M
  login-method-lookup:
    max-attempts: 30
    window: PT1M
  rate-limit:
    fail-closed-retry-after: PT5S
  onboarding:
    s3:
      bucket: test-onboarding-bucket
      presign-ttl: PT5M
